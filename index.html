<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=1024, initial-scale=1, user-scalable=no" />
    <meta name="theme-color" content="#f4f4f5" />
    <title>Janney Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', 'ui-sans-serif', 'system-ui'],
            },
            colors: {
              bg: '#f4f4f5',
              ink: {
                900: '#0f0f10',
                700: '#3f3f46',
                500: '#71717a',
                400: '#a1a1aa',
              },
            },
          },
        },
      };
    </script>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="bg-bg text-ink-900 font-sans antialiased overflow-hidden">
    <main
      id="dashboard"
      class="relative w-[1024px] h-[600px] mx-auto flex flex-col items-center"
    >
      <!-- greeting -->
      <p
        id="greeting"
        class="mt-14 text-3xl font-medium text-ink-700 tracking-tight"
      >
        &nbsp;
      </p>

      <!-- huge clock with morph animation -->
      <h1
        id="time"
        aria-label="current time"
        class="mt-6 font-bold tracking-[-0.04em] text-[200px] leading-none text-ink-900 select-none"
      ></h1>

      <!-- weather pill under clock -->
      <div class="mt-6 flex items-center gap-2 text-ink-700 text-2xl font-medium">
        <span id="weather-icon" class="inline-flex w-7 h-7 items-center justify-center"></span>
        <span id="weather-temp">--&deg;</span>
      </div>

      <!-- next game block, anchored toward the bottom -->
      <section class="mt-auto mb-12 text-center">
        <p class="text-[11px] tracking-[0.3em] uppercase text-ink-500 font-semibold">
          Next Game
        </p>
        <p id="game-title" class="mt-2 text-2xl font-semibold tracking-tight text-ink-900">
          Houston Rockets vs. Dallas Mavericks
        </p>
        <p id="game-when" class="mt-1 text-lg text-ink-500">
          Sun, Apr 26 &bull; 8:30 PM CDT
        </p>
      </section>
    </main>

    <script src="app.js"></script>
  </body>
</html>
