<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=1024, initial-scale=1, user-scalable=no" />
    <meta name="theme-color" content="#f4f4f5" />
    <title>Janney Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', 'ui-sans-serif', 'system-ui'],
            },
            colors: {
              bg: '#f4f4f5',
              ink: {
                900: '#0f0f10',
                700: '#3f3f46',
                500: '#71717a',
                400: '#a1a1aa',
              },
            },
          },
        },
      };
    </script>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="bg-bg text-ink-900 font-sans antialiased overflow-hidden min-h-screen flex items-center justify-center">
    <main
      id="dashboard"
      class="relative w-[1024px] h-[600px] px-12 flex flex-col items-center justify-center text-center"
    >
      <!-- fullscreen toggle (top-right) -->
      <button
        id="fs-btn"
        aria-label="Toggle fullscreen"
        class="absolute top-4 right-4 z-20 w-10 h-10 rounded-full text-ink-500 hover:text-ink-900 hover:bg-black/5 active:bg-black/10 flex items-center justify-center transition-colors"
      >
        <svg id="fs-icon-enter" viewBox="0 0 24 24" class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/>
        </svg>
        <svg id="fs-icon-exit" viewBox="0 0 24 24" class="w-5 h-5 hidden" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 4v5H4M15 4v5h5M9 20v-5H4M15 20v-5h5"/>
        </svg>
      </button>

      <!-- greeting + date -->
      <p id="greeting" class="text-3xl font-medium text-ink-700 tracking-tight">
        &nbsp;
      </p>
      <p id="date" class="mt-2 text-base font-medium uppercase tracking-[0.25em] text-ink-500">
        &nbsp;
      </p>

      <!-- huge clock with morph animation -->
      <h1
        id="time"
        aria-label="current time"
        class="my-6 font-bold tracking-[-0.04em] text-[180px] leading-none text-ink-900 select-none"
      ></h1>

      <!-- weather: icon · temp · highs & lows -->
      <div class="flex items-center gap-3 text-ink-700 text-2xl font-medium">
        <span id="weather-icon" class="inline-flex w-7 h-7 items-center justify-center"></span>
        <span id="weather-temp">--&deg;</span>
        <span id="weather-range" class="ml-3 text-lg text-ink-400 font-normal tracking-wide">
          H --&deg; &nbsp; L --&deg;
        </span>
      </div>

      <!-- next game (clickable) -->
      <div
        id="game-card"
        role="button"
        tabindex="0"
        aria-label="Show game stats"
        class="mt-10 rounded-2xl px-6 py-3 transition-colors hover:bg-black/[0.035] active:bg-black/[0.06]"
      >
        <p id="game-label" class="flex items-center justify-center gap-1.5 text-[11px] tracking-[0.3em] uppercase text-ink-500 font-semibold">
          <svg viewBox="0 0 24 24" class="w-3 h-3" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="9"/>
            <path d="M3 12c4 0 7-3 7-9M21 12c-4 0-7-3-7-9M3 12c4 0 7 3 7 9M21 12c-4 0-7 3-7 9"/>
          </svg>
          <span id="game-label-text">Next Game</span>
        </p>
        <p id="game-title" class="mt-2 text-2xl font-semibold tracking-tight text-ink-900">
          Houston Rockets vs. Dallas Mavericks
        </p>
        <p id="game-when" class="mt-1 text-lg text-ink-500">
          Sun, Apr 26 &bull; 8:30 PM CDT
        </p>
      </div>

      <!-- recent results (last 2 games) -->
      <div id="recents" class="mt-3 flex items-center gap-2 min-h-[36px]"></div>

      <!-- stats overlay (hidden by default) -->
      <div
        id="overlay"
        class="absolute inset-0 z-30 hidden items-center justify-center"
      >
        <div id="overlay-backdrop" class="absolute inset-0 bg-bg/85 backdrop-blur-md"></div>
        <div
          id="overlay-card"
          class="relative w-[760px] max-w-[90%] bg-white rounded-3xl px-10 py-9 shadow-[0_30px_80px_rgba(0,0,0,0.18)] border border-black/5"
        >
          <button
            id="overlay-close"
            aria-label="Close"
            class="absolute top-4 right-4 w-9 h-9 rounded-full text-ink-500 hover:text-ink-900 hover:bg-black/5 flex items-center justify-center"
          >
            <svg viewBox="0 0 24 24" class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M6 6l12 12M18 6L6 18"/>
            </svg>
          </button>
          <div id="overlay-content" class="text-left">
            <p class="text-ink-500 text-sm">Loading…</p>
          </div>
        </div>
      </div>
    </main>

    <script src="app.js"></script>
  </body>
</html>
